name: Build iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed stable Xcode
        run: |
          python3 scripts/select_xcode.py
          xcodebuild -version
          xcrun swift --version
      - name: Install project generator
        run: brew install xcodegen
      - name: Test danmaku parsing and timeline behavior
        run: swift test --package-path Packages/DanmakuCore
      - name: Test WebDAV paths, authentication and directory parsing
        run: swift test --package-path Packages/WebDAVCore
      - name: Validate project and credential exclusions
        run: python3 scripts/validate_project.py
      - name: Compile unsigned device app
        run: bash scripts/build_ios.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuFlow-unsigned
          path: build/MuFlow-unsigned.ipa
          retention-days: 3
          if-no-files-found: error
      - name: Test local video picker in an iPhone simulator
        timeout-minutes: 15
        run: bash scripts/test_ui.sh
      - name: Upload file picker UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FileImportUITests
          path: build/FileImportUITests.xcresult
          retention-days: 3
      - name: Publish validated unsigned preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import re; print(re.search(r"MARKETING_VERSION: \"([^\"]+)\"", open("project.yml").read())[1])')
          tag="v${version}-preview"
          (cd build && shasum -a 256 MuFlow-unsigned.ipa > SHA256SUMS)
          python3 - "$version" "$GITHUB_SHA" "$GITHUB_RUN_ID" <<'PY'
          import sys
          from pathlib import Path
          version, commit, run = sys.argv[1:]
          Path('build/release-notes.txt').write_text(
              f'MuFlow {version} iOS 26 preview. Refines danmaku typography with regular-weight text, native-resolution glyph outlines, lighter defaults and a live settings preview. Includes local video import, WebDAV and Youku / iQiyi / Tencent / Bilibili source danmaku.\n\n'
              f'Source: {commit}. Device compilation and automated checks passed: https://github.com/jingxk0430-hue/muflow-ios/actions/runs/{run}\n\n'
              'Unsigned IPA: a valid certificate and registered-device profile are required for installation. No signing credentials are included. Actual phone connectivity and playback still require real-device verification.\n')
          PY
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "MuFlow ${version} iOS preview" --notes-file build/release-notes.txt \
            build/MuFlow-unsigned.ipa build/SHA256SUMS
