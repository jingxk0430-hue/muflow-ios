name: Build iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed stable Xcode
        run: |
          python3 scripts/select_xcode.py
          xcodebuild -version
          xcrun swift --version
      - name: Install project generator
        run: brew install xcodegen
      - name: Test danmaku parsing and timeline behavior
        run: swift test --package-path Packages/DanmakuCore
      - name: Validate project and credential exclusions
        run: python3 scripts/validate_project.py
      - name: Test local video picker in an iPhone simulator
        run: bash scripts/test_ui.sh
      - name: Upload file picker UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FileImportUITests
          path: build/FileImportUITests.xcresult
          retention-days: 3
      - name: Compile unsigned device app
        run: bash scripts/build_ios.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuFlow-unsigned
          path: build/MuFlow-unsigned.ipa
          retention-days: 3
          if-no-files-found: error
