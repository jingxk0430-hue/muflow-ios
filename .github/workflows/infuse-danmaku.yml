name: Build standalone danmaku add-on
on:
  workflow_dispatch:
  push:
    branches: ['codex/infuse-danmaku-addon']
    paths: ['Extensions/InfuseDanmaku/**', 'App/Services/**', 'Packages/DanmakuCore/**', '.github/workflows/infuse-danmaku.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Extensions/InfuseDanmaku
    steps:
      - uses: actions/checkout@v4
      - name: Verify timeline and smooth media clock
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Tests/timeline_test.cpp -o "$RUNNER_TEMP/timeline-test"
          "$RUNNER_TEMP/timeline-test"
          c++ -std=c++17 -Wall -Wextra -Werror Tests/media_clock_test.cpp -o "$RUNNER_TEMP/media-clock-test"
          "$RUNNER_TEMP/media-clock-test"
      - name: Verify effect geometry and scheduling
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror Tests/effects_test.cpp -o "$RUNNER_TEMP/effects-test"
          "$RUNNER_TEMP/effects-test"
          clang++ -std=c++17 -fobjc-arc -Wall -Wextra -Werror -framework Foundation -framework QuartzCore -framework CoreGraphics Tests/effect_model_test.mm -o "$RUNNER_TEMP/effect-model-test"
          "$RUNNER_TEMP/effect-model-test"
      - name: Verify cached host getter ABI
        run: |
          clang++ -std=c++17 -fobjc-arc -Wall -Wextra -Werror -framework Foundation Tests/host_reader_test.mm -o "$RUNNER_TEMP/host-reader-test"
          "$RUNNER_TEMP/host-reader-test"
      - name: Verify compositor animation and playback transitions
        run: |
          clang++ -std=c++17 -fobjc-arc -Wall -Wextra -Werror -framework Foundation -framework QuartzCore -framework CoreGraphics Tests/layer_motion_test.mm -o "$RUNNER_TEMP/layer-motion-test"
          "$RUNNER_TEMP/layer-motion-test"
      - name: Build iOS dynamic library
        run: bash scripts/build-ios.sh
      - name: Verify native-resolution text bitmaps
        run: |
          clang++ -std=c++17 -fobjc-arc -Wall -Wextra -Werror -framework Foundation -framework CoreGraphics -framework CoreText -framework ImageIO Tests/text_bitmap_test.mm -o "$RUNNER_TEMP/text-bitmap-test"
          "$RUNNER_TEMP/text-bitmap-test" build/text-bitmap-preview.png build/gradient-preview.png
      - name: Verify shared ordinary parser regression
        run: swift test --package-path ../../Packages/DanmakuCore
      - name: Test four-site URL and protocol bridge with local fixtures
        run: bash scripts/test-online.sh
      - uses: actions/upload-artifact@v4
        with:
          name: InfuseDanmaku-arm64-unsigned
          path: |
            Extensions/InfuseDanmaku/build/InfuseDanmaku.dylib
            Extensions/InfuseDanmaku/build/text-bitmap-preview.png
            Extensions/InfuseDanmaku/build/gradient-preview.png
          retention-days: 7
          if-no-files-found: error
